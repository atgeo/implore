[package]
name = "shared"
crate = "shared"
# Keep in sync with [workspace.package] version in the root Cargo.toml.
version = "0.1.0"
repository = "https://github.com/atgeo/implore"
license = "NONE"

[targets.apple]
output = "../apple/generated/Shared"
include_macos = false

[targets.apple.swift]
module_name = "Shared"

[targets.apple.spm]
package_name = "Shared"
layout = "ffi-only"

[targets.android]
output = "../Android/generated"
min_sdk = 34

[targets.android.kotlin]
package = "com.atgeo.implore"
output = "../Android/generated/kotlin"

[targets.android.pack]
output = "../Android/generated/jniLibs"

[targets.wasm]
output = "../web-nextjs/generated"
profile = "release"
artifact_path = "../target/wasm32-unknown-unknown/release/shared.wasm"

[targets.wasm.typescript]
output = "../web-nextjs/generated/pkg"

[targets.wasm.npm]
package_name = "shared"

[targets.csharp]
enabled = true
namespace = "ImploreApp.Shared"
output = "../windows/generated/boltffi"
package_output = "../windows/generated/nuget"
package_id = "ImploreApp.Shared.Ffi"
target_framework = "net10.0"
runtime_identifiers = ["win-x64"]
