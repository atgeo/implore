[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
facet = { version = "=0.46.5", features = ["chrono"] }
boltffi.workspace = true
crux_core.workspace = true
serde = { workspace = true, features = ["derive"] }

anyhow = { workspace = true, optional = true }
clap = { version = "4.6.4", optional = true, features = ["derive"] }
log = { version = "0.4.33", optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["crux_core/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen"
]
