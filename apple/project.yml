name: ImploreApp
packages:
  Shared:
    path: ./generated/Shared
  App:
    path: ./generated/App
options:
  bundleIdPrefix: com.atgeo.implore
  developmentLanguage: en
  knownRegions:
    - en
    - fr
    - es
    - Base
attributes:
  BuildIndependentTargetsInParallel: true

targets:
  ImploreApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: ImploreApp
        excludes:
          - "Info-*.plist"
    scheme:
      management:
        shared: true
    settings:
      MARKETING_VERSION: ${CARGO_PKG_VERSION}
      CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: Shared
      - package: App
    info:
      path: ImploreApp/Info-iOS.plist
      properties:
        CFBundleDisplayName: Implore
        CFBundleLocalizations:
          - en
          - fr
          - es
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
